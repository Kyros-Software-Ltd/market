# Every push to main becomes a release: bump the patch version, commit it back to main, tag it and
# publish a GitHub Release. Every Market install checks the latest release and offers the update.
# For a bigger jump, run npm version minor (or major) and git push --follow-tags yourself; a commit
# that already carries its version's tag is released as it is.
# Pushes made with the workflow's own token don't start workflows, so the bump commit doesn't loop.
# The package job then builds the packaged Market (scripts/package.js) on Windows and attaches the
# zip and latest.json to the release. AffRev reads them with its own token and hands them out to
# signed-in users, who never see this repo.
name: Release

on:
    push:
        branches: [main]
        paths-ignore: ['**.md', 'LICENSE', 'NOTICE', '.github/**']
    # Run workflow on the Actions page makes a release from main by hand.
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.bump.outputs.tag }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Bump the version
              id: bump
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  version=$(node -p "require('./package.json').version")
                  if git tag --points-at HEAD | grep -qx "v$version"; then
                      echo "HEAD is already v$version"
                  else
                      git pull --ff-only origin main
                      npm version patch --no-git-tag-version --ignore-scripts
                      version=$(node -p "require('./package.json').version")
                      git commit -am "Release v$version"
                      git tag "v$version"
                      git push origin HEAD:main "v$version"
                  fi
                  echo "TAG=v$version" >> "$GITHUB_ENV"
                  echo "tag=v$version" >> "$GITHUB_OUTPUT"

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$TAG" > /dev/null 2>&1; then
                      echo "$TAG is already released"
                  else
                      gh release create "$TAG" --title "Market ${TAG#v}" --generate-notes --verify-tag
                  fi

    package:
        needs: release
        runs-on: windows-latest
        env:
            GH_TOKEN: ${{ github.token }}
            TAG: ${{ needs.release.outputs.tag }}
        defaults:
            run:
                shell: bash
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ needs.release.outputs.tag }}
                  fetch-depth: 0

            # This Node also ships inside the package as runtime/node.exe.
            - uses: actions/setup-node@v4
              with:
                  node-version: 22

            - name: Build the dashboard
              run: |
                  # go-ios's install moves its program into npm's global folder, which is on C: while
                  # the checkout is on D:; Windows can't move files across drives, so keep it on D:.
                  export NPM_CONFIG_PREFIX="$RUNNER_TEMP/npm-prefix"
                  npm ci --no-audit --no-fund
                  npm run build
                  npm prune --omit=dev

            - uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2
              with:
                  workspaces: sideload

            - name: Build the sideloading helper
              run: cargo build --release --manifest-path sideload/Cargo.toml

            - name: Package
              run: |
                  npm install --prefix "$RUNNER_TEMP/tools" --no-audit --no-fund esbuild@0.25.10
                  previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
                  export RELEASE_NOTES="$(git log --no-merges --pretty='- %s' ${previous:+$previous..}$TAG | grep -v '^- Release v' || true)"
                  ESBUILD="$RUNNER_TEMP/tools/node_modules/esbuild" node scripts/package.js

            - name: Attach to the release
              run: |
                  version=$(node -p "require('./package.json').version")
                  # latest.json last: AffRev only offers a release once it has both.
                  gh release upload "$TAG" "dist/market-$version.zip" --clobber
                  gh release upload "$TAG" dist/latest.json --clobber
