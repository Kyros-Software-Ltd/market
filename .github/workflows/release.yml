# Publishes a GitHub Release when a version tag is pushed (npm version patch && git push --follow-tags).
# Every Market install checks the latest release and offers the update.
name: Release

on:
    push:
        tags: ['v*']

permissions:
    contents: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Check the tag matches package.json
              run: |
                  version=$(node -p "require('./package.json').version")
                  if [ "v$version" != "$GITHUB_REF_NAME" ]; then
                      echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"
                      exit 1
                  fi

            - name: Create the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release create "$GITHUB_REF_NAME" --title "Market ${GITHUB_REF_NAME#v}" --generate-notes --verify-tag
