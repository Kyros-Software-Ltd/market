# Every push to main becomes a release: bump the patch version, commit it back to main, tag it and
# publish a GitHub Release. Every Market install checks the latest release and offers the update.
# For a bigger jump, run npm version minor (or major) and git push --follow-tags yourself; a commit
# that already carries its version's tag is released as it is.
# Pushes made with the workflow's own token don't start workflows, so the bump commit doesn't loop.
name: Release

on:
    push:
        branches: [main]
        paths-ignore: ['**.md', 'LICENSE', 'NOTICE', '.github/**']

permissions:
    contents: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Bump the version
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  version=$(node -p "require('./package.json').version")
                  if git tag --points-at HEAD | grep -qx "v$version"; then
                      echo "HEAD is already v$version"
                  else
                      git pull --ff-only origin main
                      npm version patch --no-git-tag-version --ignore-scripts
                      version=$(node -p "require('./package.json').version")
                      git commit -am "Release v$version"
                      git tag "v$version"
                      git push origin HEAD:main "v$version"
                  fi
                  echo "TAG=v$version" >> "$GITHUB_ENV"

            - name: Publish the release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh release view "$TAG" > /dev/null 2>&1; then
                      echo "$TAG is already released"
                  else
                      gh release create "$TAG" --title "Market ${TAG#v}" --generate-notes --verify-tag
                  fi
